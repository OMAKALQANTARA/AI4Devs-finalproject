# Production override (infra only). Use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Backend/frontend run on host (no Docker).

services:
  mysql:
    restart: unless-stopped
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-unlokd2025}

  redis:
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
