name: CI-CD EC2 UNLOKD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_backend:
    name: Build backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unlokd-backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: unlokd-backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: |
            unlokd-backend/dist
            unlokd-backend/package.json
            unlokd-backend/package-lock.json
            unlokd-backend/prisma
            unlokd-backend/prisma.config.ts
            unlokd-backend/docker-compose.yml
            unlokd-backend/docker-compose.prod.yml

  test_backend:
    name: Run backend tests
    runs-on: ubuntu-latest
    needs: build_backend
    defaults:
      run:
        working-directory: unlokd-backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: unlokd-backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test -- --runInBand

  build_frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    needs: test_backend
    defaults:
      run:
        working-directory: unlokd-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Resolve EC2 public host
        id: resolve_host
        shell: bash
        run: |
          set -euo pipefail
          INSTANCE_INPUT="${{ secrets.EC2_INSTANCE }}"
          if [[ -z "${INSTANCE_INPUT}" ]]; then
            echo "Secret EC2_INSTANCE is empty or missing"
            exit 1
          fi
          HOST="$INSTANCE_INPUT"
          if [[ "$INSTANCE_INPUT" =~ ^i- ]]; then
            DNS="$(aws ec2 describe-instances \
              --instance-ids "$INSTANCE_INPUT" \
              --query 'Reservations[0].Instances[0].PublicDnsName' \
              --output text)"
            IP="$(aws ec2 describe-instances \
              --instance-ids "$INSTANCE_INPUT" \
              --query 'Reservations[0].Instances[0].PublicIpAddress' \
              --output text)"
            if [[ -n "$DNS" && "$DNS" != "None" ]]; then
              HOST="$DNS"
            elif [[ -n "$IP" && "$IP" != "None" ]]; then
              HOST="$IP"
            else
              echo "No public DNS/IP found for instance $INSTANCE_INPUT"
              exit 1
            fi
          fi
          if [[ -z "$HOST" || "$HOST" == "None" ]]; then
            echo "Resolved host is empty"
            exit 1
          fi
          echo "ec2_host=$HOST" >> "$GITHUB_OUTPUT"
          echo "Resolved frontend build target: $HOST"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: unlokd-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_BASE_URL: http://${{ steps.resolve_host.outputs.ec2_host }}:3000
          VITE_WS_BASE_URL: http://${{ steps.resolve_host.outputs.ec2_host }}:3000
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: unlokd-frontend/dist

  e2e_tests:
    name: Run e2e tests
    runs-on: ubuntu-latest
    needs: build_frontend
    defaults:
      run:
        working-directory: unlokd-backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: unlokd-backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run e2e tests
        run: npm run test:e2e -- --runInBand

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: e2e_tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Resolve EC2 public host
        id: resolve_host
        shell: bash
        run: |
          set -euo pipefail
          INSTANCE_INPUT="${{ secrets.EC2_INSTANCE }}"
          if [[ -z "${INSTANCE_INPUT}" ]]; then
            echo "Secret EC2_INSTANCE is empty or missing"
            exit 1
          fi
          HOST="$INSTANCE_INPUT"
          if [[ "$INSTANCE_INPUT" =~ ^i- ]]; then
            DNS="$(aws ec2 describe-instances \
              --instance-ids "$INSTANCE_INPUT" \
              --query 'Reservations[0].Instances[0].PublicDnsName' \
              --output text)"
            IP="$(aws ec2 describe-instances \
              --instance-ids "$INSTANCE_INPUT" \
              --query 'Reservations[0].Instances[0].PublicIpAddress' \
              --output text)"
            if [[ -n "$DNS" && "$DNS" != "None" ]]; then
              HOST="$DNS"
            elif [[ -n "$IP" && "$IP" != "None" ]]; then
              HOST="$IP"
            else
              echo "No public DNS/IP found for instance $INSTANCE_INPUT"
              exit 1
            fi
          fi
          if [[ -z "$HOST" || "$HOST" == "None" ]]; then
            echo "Resolved host is empty"
            exit 1
          fi
          echo "ec2_host=$HOST" >> "$GITHUB_OUTPUT"
          echo "Resolved deploy target: $HOST"

      - uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: backend-build

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Upload backend artifact to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.resolve_host.outputs.ec2_host }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: backend-build/*
          target: /tmp/unlokd-release-backend
          strip_components: 1

      - name: Upload frontend artifact to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.resolve_host.outputs.ec2_host }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: frontend-dist/*
          target: /tmp/unlokd-release-frontend
          strip_components: 1

      - name: Remote deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.resolve_host.outputs.ec2_host }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            if [ "${{ secrets.EC2_USER }}" = "root" ]; then
              APP_HOME="/root/AI4Devs-finalproject"
            else
              APP_HOME="/home/${{ secrets.EC2_USER }}/AI4Devs-finalproject"
            fi

            BACKEND_DIR="$APP_HOME/unlokd-backend"
            FRONTEND_DIR="$APP_HOME/unlokd-frontend"

            mkdir -p "$BACKEND_DIR" "$FRONTEND_DIR"

            if [ -f "$BACKEND_DIR/docker-compose.yml" ] && [ -f "$BACKEND_DIR/docker-compose.prod.yml" ]; then
              cd "$BACKEND_DIR"
              docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d mysql redis || true
            fi

            cp -R /tmp/unlokd-release-backend/* "$BACKEND_DIR/"
            cd "$BACKEND_DIR"
            npm ci --omit=dev
            npx prisma migrate deploy || npx prisma db push

            pm2 delete unlokd-backend || true
            pm2 start dist/main.js --name unlokd-backend
            pm2 save

            sudo rm -rf /usr/share/nginx/html/*
            sudo cp -R /tmp/unlokd-release-frontend/* /usr/share/nginx/html/
            sudo nginx -t
            sudo systemctl reload nginx

            curl -fsS http://127.0.0.1:3000/health >/dev/null

  report_summary:
    name: Report summary
    runs-on: ubuntu-latest
    needs: [build_backend, test_backend, build_frontend, e2e_tests, deploy]
    if: always()
    steps:
      - name: Write pipeline summary
        shell: bash
        run: |
          {
            echo "## CI/CD Summary"
            echo ""
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| Build backend | ${{ needs.build_backend.result }} |"
            echo "| Test backend | ${{ needs.test_backend.result }} |"
            echo "| Build frontend | ${{ needs.build_frontend.result }} |"
            echo "| E2E tests | ${{ needs.e2e_tests.result }} |"
            echo "| Deploy EC2 | ${{ needs.deploy.result }} |"
            echo ""
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
